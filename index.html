<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
    

<body>

    <div class="chatbot">

        <div class="cabecalho">
            <h1>🤖 Assistente Virtual</h1>
            <p>Atendimento online</p>
        </div>

        <div class="chat" id="chat">

            <div class="mensagem bot">
                Olá! 👋 Como posso ajudar você?
            </div>

        </div>
<button onclick="limparConversa()">
    🗑️ Limpar conversa
</button>
        <div class="botoes">

    <button onclick="perguntaRapida('Qual o preço?')">
        💰 Preços
    </button>

    <button onclick="perguntaRapida('Quais serviços vocês oferecem?')">
        🛠️ Serviços
    </button>

    <button onclick="perguntaRapida('Qual o horário de atendimento?')">
        🕐 Horário
    </button>

    <button onclick="perguntaRapida('Quero falar com um atendente')">
        📞 Atendimento
    </button>

</div>
        <div class="entrada">

            <input
                type="text"
                id="mensagem"
                placeholder="Digite sua mensagem..."
            >

            <button onclick="enviarMensagem()">Enviar</button>

        </div>

    </div>
<script src="script.js"></script>
</body>

</html>
