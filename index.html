<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assistente Virtual</title>
</head>

<body>

    <div class="chatbot">

        <div class="cabecalho">
            <h1>🤖 Assistente Virtual</h1>
            <p>Atendimento online</p>
        </div>

        <div class="chat" id="chat">

            <div class="mensagem bot">
                Olá! 👋 Como posso ajudar você?
            </div>

        </div>

        <div class="botoes">

            <button>💰 Preços</button>

            <button>🛠️ Serviços</button>

            <button>🕐 Horário</button>

            <button>📞 Atendimento</button>

        </div>

        <div class="entrada">

            <input
                type="text"
                id="mensagem"
                placeholder="Digite sua mensagem..."
            >

            <button>Enviar</button>

        </div>

    </div>

</body>

</html>
